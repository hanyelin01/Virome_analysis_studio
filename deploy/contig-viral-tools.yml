name: contig-ui
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - fastp
  - megahit
  - genomad
  - checkv
  - coverm
  - vclust
  - minimap2
  - samtools
  - diamond
  - taxonkit
# v2 requires VirSorter2 as a peer discovery method.  It remains a separate
# installation because its database setup is managed by VirSorter2 itself:
#   mamba install -n contig-ui -c conda-forge -c bioconda virsorter=2
